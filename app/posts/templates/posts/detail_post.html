{% extends 'base.html' %}
{% block content %}

<div class="container py-5">
  <div class="card border-0 shadow-lg rounded-4 p-4 mx-auto" style="max-width: 850px; background: #fff9ff;">
    
    <h2 class="fw-bold text-gradient mb-2">{{ post.title }}</h2>

    <p class="text-muted small mb-4">
      <i class="bi bi-folder2-open"></i> {{ post.category.value }}
      &nbsp;•&nbsp;
      <i class="bi bi-calendar3"></i> {{ post.posted.strftime('%Y-%m-%d %H:%M') }}
    </p>

    <hr class="my-3">

    <p class="fs-5 lh-lg text-secondary">{{ post.content }}</p>

    <hr class="my-4">

    <div class="d-flex flex-wrap gap-3">
      <a href="{{ url_for('post_bp.update_post', id=post.id) }}" 
         class="btn btn-warning px-4 fw-semibold">
         ✏️ Edit
      </a>

      <a href="{{ url_for('post_bp.delete_post', id=post.id) }}" 
         class="btn btn-danger px-4 fw-semibold">
         🗑️ Delete
      </a>

      <a href="{{ url_for('post_bp.all_posts') }}" 
         class="btn btn-gradient px-4 fw-semibold">
         ← Back
      </a>
    </div>

  </div>
</div>

{% endblock %}

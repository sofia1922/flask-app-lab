{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="products-container p-4 bg-white rounded-4 shadow-sm">
  <h1 class="section-title">Наші товари</h1>

  <ul class="list-group">
    {% for item in items %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ item.name }}
        <span class="badge bg-light text-dark">{{ item.price }} грн</span>
      </li>
    {% endfor %}
  </ul>

  <a href="{{ url_for('main.resume') }}" class="btn btn-outline-primary mt-3">Повернутися до резюме</a>
</div>
{% endblock %}

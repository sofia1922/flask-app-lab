{% extends 'base.html' %}

{% block content %}
<div class="container mt-4 p-4 bg-white rounded-4 shadow-sm" style="max-width: 500px;">
    <h2 class="mb-3 text-center text-primary">👤 Профіль користувача</h2>

    <div class="card shadow-sm rounded-3">
        <div class="card-body">
            <h5 class="card-title">Вітаємо, {{ user.username }}!</h5>

            <p class="mb-1"><strong>Email:</strong> {{ user.email }}</p>
            <p class="mb-3"><strong>ID:</strong> {{ user.id }}</p>

            <a href="{{ url_for('users.logout') }}" class="btn btn-outline-danger w-100 mt-3">
                Вийти
            </a>
        </div>
    </div>
</div>
{% endblock %}

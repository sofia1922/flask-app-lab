{% extends 'base.html' %}
{% block content %}
<div class="container mt-4 p-4 bg-white rounded-4 shadow-sm" style="max-width: 400px;">
  <h2 class="mb-3 text-center text-primary">Вхід у систему</h2>
  <form method="POST">
    <div class="mb-3">
      <label for="username" class="form-label">Ім’я користувача</label>
      <input type="text" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Пароль</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-outline-primary w-100">Увійти</button>
  </form>
</div>
{% endblock %}
